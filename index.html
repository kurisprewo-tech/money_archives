  <button id="bC" onclick="bukaMenu('C')"><span class="bi">📈</span>Grafik</button>
  <button id="bD" onclick="bukaMenu('D')"><span class="bi">📜</span>Riwayat</button>
  <button id="bE" onclick="bukaMenu('E')"><span class="bi">🗓️</span>Harian</button>

<!-- MONEY ARCHIVES — BAGIAN 2/2
Tambahkan perubahan JavaScript ini ke kode asli:
1) Ganti bukaMenu() lama.
2) Ganti buatGrafik() lama.
3) Tambahkan fungsi-fungsi harian.
4) Ganti DOMContentLoaded.
-->

<script>
function bukaMenu(menu){
  ["A","B","C","D","E"].forEach(x=>{
    document.getElementById("sec"+x).classList.toggle("active",x===menu);
    document.getElementById("m"+x).classList.toggle("active",x===menu);
    document.getElementById("b"+x).classList.toggle("active",x===menu);
  });
  if(menu==="C")setTimeout(buatGrafik,30);
  if(menu==="D")renderHistory();
  if(menu==="E")renderHarian();
}

function formatTanggalInput(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function getTanggalHarian(){
  const input=document.getElementById("tanggalHarian");
  if(!input.value)input.value=formatTanggalInput(new Date());
  const parts=input.value.split("-");
  return new Date(Number(parts[0]),Number(parts[1])-1,Number(parts[2]));
}

function renderHarian(){
  const tanggal=getTanggalHarian();

  const namaHari=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
  document.getElementById("namaHari").textContent=namaHari[tanggal.getDay()];
  document.getElementById("tanggalHari").textContent=tanggal.toLocaleDateString("id-ID",{
    day:"2-digit",month:"long",year:"numeric"
  });

  const pengeluaran=data.riwayat.filter(t=>{
    if(t.jenis!=="keluar")return false;
    const d=new Date(t.timestamp);
    return d.getFullYear()===tanggal.getFullYear() &&
           d.getMonth()===tanggal.getMonth() &&
           d.getDate()===tanggal.getDate();
  });

  const total=pengeluaran.reduce((sum,t)=>sum+Number(t.jumlah||0),0);
  document.getElementById("pengeluaranHarian").textContent=rupiah(total);

  document.getElementById("jumlahTransaksiHarian").textContent=
    pengeluaran.length
      ? `💸 ${pengeluaran.length} transaksi pengeluaran pada hari ini.`
      : "Belum ada pengeluaran pada hari ini.";

  const detail=document.getElementById("detailHarian");

  if(!pengeluaran.length){
    detail.innerHTML='<div class="empty">Tidak ada pengeluaran pada hari ini.</div>';
    return;
  }

  pengeluaran.sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));

  detail.innerHTML=pengeluaran.map(t=>{
    const d=new Date(t.timestamp);
    return `<div class="daily-item">
      <div>
        <b>${escapeHTML(t.keterangan)}</b>
        <div class="muted">${d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})} WIB</div>
      </div>
      <b class="minus">-${rupiah(t.jumlah)}</b>
    </div>`;
  }).join("");
}

function ubahHari(jumlah){
  const tanggal=getTanggalHarian();
  tanggal.setDate(tanggal.getDate()+jumlah);
  document.getElementById("tanggalHarian").value=formatTanggalInput(tanggal);
  renderHarian();
}

function buatGrafik(){
  if(!window.Chart)return;

  const canvas=document.getElementById("chart");
  if(!canvas)return;

  const harian={};

  data.riwayat.forEach(t=>{
    if(t.jenis!=="keluar")return;

    const d=new Date(t.timestamp);
    const key=d.getFullYear()+"-"+
      String(d.getMonth()+1).padStart(2,"0")+"-"+
      String(d.getDate()).padStart(2,"0");

    if(!harian[key]){
      harian[key]={
        tanggal:new Date(d.getFullYear(),d.getMonth(),d.getDate()),
        total:0
      };
    }

    harian[key].total+=Number(t.jumlah)||0;
  });

  const daftar=Object.values(harian).sort((a,b)=>a.tanggal-b.tanggal);

  const namaHariSingkat=["Min","Sen","Sel","Rab","Kam","Jum","Sab"];

  const labels=daftar.map(item=>{
    const d=item.tanggal;
    return namaHariSingkat[d.getDay()]+" "+d.getDate()+" "+
      d.toLocaleDateString("id-ID",{month:"short"});
  });

  const values=daftar.map(item=>item.total);

  if(chart)chart.destroy();

  if(!daftar.length){
    document.getElementById("chartStatus").textContent=
      "Belum ada data pengeluaran untuk dibuat grafik.";
    return;
  }

  document.getElementById("chartStatus").textContent=
    "Total pengeluaran per hari";

  chart=new Chart(canvas,{
    type:"line",
    data:{
      labels:labels,
      datasets:[{
        label:"Pengeluaran Harian",
        data:values,
        tension:.3,
        fill:false,
        borderWidth:2,
        pointRadius:4
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{legend:{display:true}},
      scales:{y:{ticks:{callback:v=>rupiah(v)}}}
    }
  });
}

document.addEventListener("DOMContentLoaded",()=>{
  const input=document.getElementById("tanggalHarian");
  if(input)input.value=formatTanggalInput(new Date());

  loadChartJS();
  mulai();
});
</script>
