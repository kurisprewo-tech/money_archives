<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Archives</title>

  <!-- Telegram Web App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Chart.js untuk grafik -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .saldo {
      font-size: 30px;
      font-weight: bold;
      margin-top: 8px;
    }

    .tabungan {
      font-size: 26px;
      font-weight: bold;
      margin-top: 8px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    .masuk {
      background: #d9f7df;
    }

    .keluar {
      background: #ffdede;
    }

    .simpan-tabungan {
      background: #fff0b8;
    }

    .ambil-tabungan {
      background: #e4d7ff;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    .submit {
      width: 100%;
      background: #222;
      color: white;
      margin-top: 8px;
    }

    .item {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .green {
      color: green;
    }

    .red {
      color: red;
    }

    .yellow {
      color: #c28a00;
    }

    .purple {
      color: #7138c8;
    }

    .hidden {
      display: none;
    }

    .kosong {
      color: #777;
      text-align: center;
      padding: 10px;
    }

    canvas {
      max-width: 100%;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>🐝 Money Archives</h1>


  <!-- =====================
       SALDO
  ====================== -->

  <div class="card">

    <div>💰 Saldo</div>

    <div
      class="saldo"
      id="saldo"
    >
      Rp0
    </div>

  </div>


  <!-- =====================
       TABUNGAN
  ====================== -->

  <div class="card">

    <div>🐝 Total Tabungan</div>

    <div
      class="tabungan"
      id="tabungan"
    >
      Rp0
    </div>

  </div>


  <!-- =====================
       TRANSAKSI
  ====================== -->

  <div class="card">

    <h3>💳 Transaksi</h3>

    <div class="buttons">

      <button
        class="masuk"
        onclick="showForm('masuk')"
      >
        ➕ Pemasukan
      </button>

      <button
        class="keluar"
        onclick="showForm('keluar')"
      >
        ➖ Pengeluaran
      </button>

    </div>

  </div>


  <!-- =====================
       TABUNGAN
  ====================== -->

  <div class="card">

    <h3>🐝 Tabungan</h3>

    <div class="buttons">

      <button
        class="simpan-tabungan"
        onclick="showForm('tabungan_masuk')"
      >
        💵 Masuk Tabungan
      </button>

      <button
        class="ambil-tabungan"
        onclick="showForm('tabungan_keluar')"
      >
        💸 Keluar Tabungan
      </button>

    </div>

  </div>


  <!-- =====================
       FORM
  ====================== -->

  <div
    class="card hidden"
    id="formCard"
  >

    <h3 id="formTitle">
      Tambah Transaksi
    </h3>

    <input
      type="number"
      id="jumlah"
      placeholder="Jumlah (Rp)"
      min="1"
    >

    <input
      type="text"
      id="keterangan"
      placeholder="Keterangan"
    >

    <button
      class="submit"
      onclick="simpan()"
    >
      Simpan
    </button>

  </div>


  <!-- =====================
       RIWAYAT
  ====================== -->

  <div class="card">

    <h3>📜 Riwayat</h3>

    <div id="riwayat">

      <div class="kosong">
        Belum ada transaksi.
      </div>

    </div>

  </div>


  <!-- =====================
       GRAFIK
  ====================== -->

  <div class="card">

    <h3 id="judulGrafik">
      📊 Grafik Bulanan
    </h3>

    <canvas id="grafik"></canvas>

  </div>

</div>


<script>

  /* =========================
     TELEGRAM
  ========================= */

  const tg =
    window.Telegram.WebApp;

  tg.ready();
  tg.expand();


  /* =========================
     DATA
  ========================= */

  let saldo =
    Number(
      localStorage.getItem("saldo")
    ) || 0;


  let tabungan =
    Number(
      localStorage.getItem("tabungan")
    ) || 0;


  let riwayat =
    JSON.parse(
      localStorage.getItem("riwayat")
    ) || [];


  let tipe = "";

  let chart = null;


  /* =========================
     RUPIAH
  ========================= */

  function rupiah(angka) {

    return new Intl.NumberFormat(
      "id-ID",
      {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
      }
    ).format(angka);

  }


  /* =========================
     FORM
  ========================= */

  function showForm(jenis) {

    tipe = jenis;

    document
      .getElementById("formCard")
      .classList.remove("hidden");


    let title = "";


    if (jenis === "masuk") {

      title =
        "➕ Tambah Pemasukan";

    }


    else if (jenis === "keluar") {

      title =
        "➖ Tambah Pengeluaran";

    }


    else if (
      jenis === "tabungan_masuk"
    ) {

      title =
        "💵 Masuk Tabungan";

    }


    else if (
      jenis === "tabungan_keluar"
    ) {

      title =
        "💸 Keluar Tabungan";

    }


    document
      .getElementById("formTitle")
      .innerText = title;


    document
      .getElementById("jumlah")
      .value = "";


    document
      .getElementById("keterangan")
      .value = "";


    document
      .getElementById("jumlah")
      .focus();

  }


  /* =========================
     SIMPAN
  ========================= */

  function simpan() {

    const jumlah =
      Number(
        document
          .getElementById("jumlah")
          .value
      );


    const keterangan =
      document
        .getElementById("keterangan")
        .value
        .trim();


    if (
      !jumlah ||
      jumlah <= 0
    ) {

      alert(
        "Masukkan jumlah yang benar."
      );

      return;

    }


    if (!keterangan) {

      alert(
        "Masukkan keterangan."
      );

      return;

    }


    /* =====================
       PEMASUKAN
    ====================== */

    if (
      tipe === "masuk"
    ) {

      saldo += jumlah;

    }


    /* =====================
       PENGELUARAN
    ====================== */

    else if (
      tipe === "keluar"
    ) {

      if (
        jumlah > saldo
      ) {

        alert(
          "Saldo tidak mencukupi."
        );

        return;

      }

      saldo -= jumlah;

    }


    /* =====================
       TABUNGAN MASUK
    ====================== */

    else if (
      tipe === "tabungan_masuk"
    ) {

      if (
        jumlah > saldo
      ) {

        alert(
          "Saldo tidak mencukupi untuk menabung."
        );

        return;

      }

      saldo -= jumlah;

      tabungan += jumlah;

    }


    /* =====================
       TABUNGAN KELUAR
    ====================== */

    else if (
      tipe === "tabungan_keluar"
    ) {

      if (
        jumlah > tabungan
      ) {

        alert(
          "Tabungan tidak mencukupi."
        );

        return;

      }

      tabungan -= jumlah;

      saldo += jumlah;

    }


    /* =====================
       TANGGAL
    ====================== */

    const sekarang =
      new Date();


    const tanggal =
      sekarang.toLocaleString(
        "id-ID"
      );


    /* =====================
       RIWAYAT
    ====================== */

    riwayat.push({

      tipe: tipe,

      jumlah: jumlah,

      keterangan: keterangan,

      tanggal: tanggal

    });


    /* =====================
       LOCAL STORAGE
    ====================== */

    localStorage.setItem(
      "saldo",
      saldo
    );


    localStorage.setItem(
      "tabungan",
      tabungan
    );


    localStorage.setItem(
      "riwayat",
      JSON.stringify(
        riwayat
      )
    );


    /* =====================
       RESET
    ====================== */

    document
      .getElementById("jumlah")
      .value = "";


    document
      .getElementById("keterangan")
      .value = "";


    document
      .getElementById("formCard")
      .classList.add("hidden");


    update();

  }


  /* =========================
     UPDATE
  ========================= */

  function update() {

    document
      .getElementById("saldo")
      .innerText =
      rupiah(saldo);


    document
      .getElementById("tabungan")
      .innerText =
      rupiah(tabungan);


    tampilkanRiwayat();

    buatGrafik();

  }


  /* =========================
     RIWAYAT
  ========================= */

  function tampilkanRiwayat() {

    const box =
      document.getElementById(
        "riwayat"
      );


    if (
      riwayat.length === 0
    ) {

      box.innerHTML = `
        <div class="kosong">
          Belum ada transaksi.
        </div>
      `;

      return;

    }


    box.innerHTML = "";


    riwayat
      .slice()
      .reverse()
      .forEach(
        function(item) {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "item";


          let tanda = "";

          let kelas = "";

          let nama = "";


          if (
            item.tipe === "masuk"
          ) {

            tanda = "+";

            kelas = "green";

            nama =
              "Pemasukan";

          }


          else if (
            item.tipe === "keluar"
          ) {

            tanda = "-";

            kelas = "red";

            nama =
              "Pengeluaran";

          }


          else if (
            item.tipe ===
            "tabungan_masuk"
          ) {

            tanda = "🐝 +";

            kelas = "yellow";

            nama =
              "Masuk Tabungan";

          }


          else if (
            item.tipe ===
            "tabungan_keluar"
          ) {

            tanda = "🐝 -";

            kelas = "purple";

            nama =
              "Keluar Tabungan";

          }


          div.innerHTML = `

            <b class="${kelas}">
              ${tanda}
              ${rupiah(item.jumlah)}
            </b>

            <br>

            <b>
              ${nama}
            </b>

            <br>

            ${item.keterangan}

            <br>

            <small>
              📅 ${item.tanggal}
            </small>

          `;


          box.appendChild(
            div
          );

        }
      );

  }


  /* =========================
     GRAFIK 1 BULAN
  ========================= */

  function buatGrafik() {

    const sekarang =
      new Date();


    const tahun =
      sekarang.getFullYear();


    const bulan =
      sekarang.getMonth();


    let totalMasuk = 0;

    let totalKeluar = 0;


    /* HITUNG BULAN SEKARANG */

    riwayat.forEach(
      function(item) {

        const bagian =
          item.tanggal
            .split(",")[0]
            .split("/");


        if (
          bagian.length !== 3
        ) {
          return;
        }


        const tanggalItem =
          Number(
            bagian[0]
          );


        const bulanItem =
          Number(
            bagian[1]
          ) - 1;


        const tahunItem =
          Number(
            bagian[2]
          );


        if (
          tahunItem === tahun &&
          bulanItem === bulan
        ) {

          if (
            item.tipe ===
            "masuk"
          ) {

            totalMasuk +=
              item.jumlah;

          }


          if (
            item.tipe ===
            "keluar"
          ) {

            totalKeluar +=
              item.jumlah;

          }

        }

      }
    );


    /* NAMA BULAN */

    const namaBulan =
      sekarang.toLocaleString(
        "id-ID",
        {
          month: "long",
          year: "numeric"
        }
      );


    document
      .getElementById(
        "judulGrafik"
      )
      .innerText =
      "📊 Grafik " +
      namaBulan;


    /* HAPUS GRAFIK LAMA */

    if (chart) {

      chart.destroy();

    }


    /* BUAT GRAFIK */

    const canvas =
      document.getElementById(
        "grafik"
      );


    chart =
      new Chart(
        canvas.getContext("2d"),
        {

          type: "bar",

          data: {

            labels: [
              "Pemasukan",
              "Pengeluaran"
            ],

            datasets: [

              {

                label:
                  namaBulan,

                data: [
                  totalMasuk,
                  totalKeluar
                ]

              }

            ]

          },

          options: {

            responsive: true,

            plugins: {

              legend: {

                display: true

              },

              tooltip: {

                callbacks: {

                  label:
                    function(context) {

                      return rupiah(
                        context.raw
                      );

                    }

                }

              }

            },

            scales: {

              y: {

                beginAtZero: true,

                ticks: {

                  callback:
                    function(value) {

                      return "Rp" +
                        Number(value)
                          .toLocaleString(
                            "id-ID"
                          );

                    }

                }

              }

            }

          }

        }
      );

  }


  /* =========================
     JALANKAN
  ========================= */

  update();

</script>

</body>
</html>
