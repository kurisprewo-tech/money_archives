<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Money Archives</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
.app{max-width:760px;margin:auto;padding:18px}
h1{margin:0;font-size:28px}.sub{color:#6b7280;margin:5px 0 18px}
.card{background:white;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.balance{font-size:34px;font-weight:800;margin:8px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px;border-radius:14px;background:#f9fafb}.stat b{display:block;font-size:20px;margin-top:5px}
label{display:block;font-weight:700;margin:12px 0 6px}
input,select,button{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;font-size:16px}
button{border:0;background:#111827;color:white;font-weight:700;cursor:pointer;margin-top:12px}
button.secondary{background:#e5e7eb;color:#111827}
button.danger{background:#dc2626}
.progress{height:14px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:12px 0}
.progress>div{height:100%;width:0;background:#111827;transition:width .3s}
.target-row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.target-row button{width:auto;margin:0;padding:8px 12px}
.history-item{padding:13px 0;border-bottom:1px solid #e5e7eb}
.history-item:last-child{border-bottom:0}
.history-top{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.muted{color:#6b7280;font-size:13px}
.plus{color:#15803d}.minus{color:#dc2626}
.empty{text-align:center;color:#6b7280;padding:20px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#111827;color:white;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{position:fixed;inset:0;background:#f3f4f6;display:flex;align-items:center;justify-content:center;z-index:99;transition:opacity .2s}
.loading.hide{opacity:0;pointer-events:none}
.loader{text-align:center}.bee{font-size:58px}.loader b{display:block;margin-top:8px}
canvas{width:100%!important;max-height:300px}
@media(max-width:480px){.app{padding:12px}.grid{grid-template-columns:1fr}.balance{font-size:29px}}
</style>
</head>
<body>

<div id="loading" class="loading">
  <div class="loader"><div class="bee">🐝</div><b>Money Archives</b><div class="muted">Memuat...</div></div>
</div>

<div class="app">
  <h1>💰 Money Archives</h1>
  <div class="sub">Kelola uang dan target tabunganmu.</div>

  <div class="card">
    <div class="muted">Saldo</div>
    <div id="saldo" class="balance">Rp0</div>
    <div class="grid">
      <div class="stat"><span class="muted">Pemasukan</span><b id="totalMasuk">Rp0</b></div>
      <div class="stat"><span class="muted">Pengeluaran</span><b id="totalKeluar">Rp0</b></div>
    </div>
  </div>

  <div class="card">
    <div class="target-row">
      <div><div class="muted">🎯 Target Tabungan</div><b id="targetText">Belum ada target</b></div>
      <button class="secondary" onclick="ubahTarget()">Atur</button>
    </div>
    <div id="targetInfo" class="muted" style="margin-top:10px">Atur target untuk melihat progres.</div>
    <div class="progress"><div id="progressBar"></div></div>
  </div>

  <div class="card">
    <div class="grid">
      <div class="stat"><span class="muted">Tabungan</span><b id="tabungan">Rp0</b></div>
      <div class="stat"><span class="muted">Transaksi</span><b id="jumlahTransaksi">0</b></div>
    </div>
  </div>

  <div class="card">
    <h2>➕ Tambah Transaksi</h2>
    <label>Jenis</label>
    <select id="jenis">
      <option value="masuk">Pemasukan</option>
      <option value="keluar">Pengeluaran</option>
      <option value="tabungan_masuk">Tabungan Masuk</option>
      <option value="tabungan_keluar">Tabungan Keluar</option>
    </select>

    <label>Nominal</label>
    <input id="nominal" inputmode="text" placeholder="Contoh: 10rb, 1,5jt, 10.000">

    <label>Keterangan</label>
    <input id="keterangan" placeholder="Contoh: Gaji, makan, nabung...">

    <button onclick="tambahTransaksi()">Simpan Transaksi</button>
  </div>

  <div class="card">
    <h2>📈 Pergerakan Saldo</h2>
    <div id="chartStatus" class="muted">Grafik sedang disiapkan...</div>
    <canvas id="chart"></canvas>
  </div>

  <div class="card">
    <h2>📝 Riwayat</h2>
    <div id="history"></div>
    <button class="danger" onclick="hapusSemua()">Hapus Semua Riwayat</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const KEY="money_archives_v3";
let data={saldo:0,tabungan:0,target:0,riwayat:[]};
let chart=null, chartReady=false;

function rupiah(n){
  return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);
}

function escapeHTML(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

/* Mendukung: 10rb, 10k, 10.000, 10000, 1jt, 1,5jt, 1.5jt */
function parseNominal(value){
  let s=String(value).toLowerCase().trim().replace(/\s+/g,"");
  if(!s) return NaN;
  let mult=1;
  if(s.endsWith("jt")||s.endsWith("juta")){mult=1000000;s=s.replace(/juta?$/,"");}
  else if(s.endsWith("rb")||s.endsWith("ribu")){mult=1000;s=s.replace(/ribu?$/,"");}
  else if(s.endsWith("k")){mult=1000;s=s.slice(0,-1);}
  s=s.replace(/[^\d.,-]/g,"");
  if(!s) return NaN;

  if(mult!==1){
    s=s.replace(/\./g,"").replace(",",".");
    const n=parseFloat(s);
    return Number.isFinite(n)?Math.round(n*mult):NaN;
  }

  /* Tanpa suffix, titik dianggap pemisah ribuan. */
  if(s.includes(",")){
    s=s.replace(/\./g,"").replace(",",".");
    const n=parseFloat(s);
    return Number.isFinite(n)?Math.round(n):NaN;
  }
  if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  const n=Number(s);
  return Number.isFinite(n)?Math.round(n):NaN;
}

function simpan(){localStorage.setItem(KEY,JSON.stringify(data));}
function muat(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||"null");
    if(x && typeof x==="object"){
      data={
        saldo:Number(x.saldo)||0,
        tabungan:Number(x.tabungan)||0,
        target:Number(x.target)||0,
        riwayat:Array.isArray(x.riwayat)?x.riwayat:[]
      };
    }
  }catch(e){}
}

function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;el.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>el.classList.remove("show"),2200);
}

function updateTampilan(){
  document.getElementById("saldo").textContent=rupiah(data.saldo);
  document.getElementById("tabungan").textContent=rupiah(data.tabungan);
  document.getElementById("jumlahTransaksi").textContent=data.riwayat.length;

  let masuk=0,keluar=0;
  data.riwayat.forEach(t=>{
    if(t.jenis==="masuk") masuk+=t.jumlah;
    if(t.jenis==="keluar") keluar+=t.jumlah;
  });
  document.getElementById("totalMasuk").textContent=rupiah(masuk);
  document.getElementById("totalKeluar").textContent=rupiah(keluar);

  if(data.target>0){
    const persen=Math.min(100,(data.tabungan/data.target)*100);
    document.getElementById("targetText").textContent=rupiah(data.target);
    document.getElementById("targetInfo").textContent=
      rupiah(data.tabungan)+" / "+rupiah(data.target)+" • "+persen.toFixed(1)+"%";
    document.getElementById("progressBar").style.width=persen+"%";
  }else{
    document.getElementById("targetText").textContent="Belum ada target";
    document.getElementById("targetInfo").textContent="Atur target untuk melihat progres.";
    document.getElementById("progressBar").style.width="0%";
  }

  renderHistory();
  if(chartReady) setTimeout(buatGrafik,0);
}

function tambahTransaksi(){
  const jenis=document.getElementById("jenis").value;
  const jumlah=parseNominal(document.getElementById("nominal").value);
  const ket=document.getElementById("keterangan").value.trim();

  if(!Number.isFinite(jumlah)||jumlah<=0){
    toast("❌ Nominal tidak valid");
    return;
  }

  if(jenis==="masuk") data.saldo+=jumlah;
  if(jenis==="keluar"){
    if(jumlah>data.saldo){toast("❌ Saldo tidak cukup");return;}
    data.saldo-=jumlah;
  }
  if(jenis==="tabungan_masuk"){
    if(jumlah>data.saldo){toast("❌ Saldo tidak cukup");return;}
    data.saldo-=jumlah;data.tabungan+=jumlah;
  }
  if(jenis==="tabungan_keluar"){
    if(jumlah>data.tabungan){toast("❌ Tabungan tidak cukup");return;}
    data.tabungan-=jumlah;data.saldo+=jumlah;
  }

  data.riwayat.push({
    id:Date.now()+Math.random(),
    jenis,jumlah,
    keterangan:ket||"Tanpa keterangan",
    timestamp:new Date().toISOString(),
    saldoSetelah:data.saldo,
    tabunganSetelah:data.tabungan
  });

  simpan();
  document.getElementById("nominal").value="";
  document.getElementById("keterangan").value="";
  updateTampilan();
  toast("✅ Transaksi berhasil disimpan");
  if(data.target>0 && data.tabungan>=data.target) setTimeout(()=>toast("🏆 Target tabungan tercapai!"),500);
}

function ubahTarget(){
  const old=data.target?rupiah(data.target):"belum ada";
  const input=prompt("Masukkan target tabungan.\nContoh: 10jt atau 10.000.000",data.target||"");
  if(input===null)return;
  const n=parseNominal(input);
  if(!Number.isFinite(n)||n<=0){toast("❌ Target tidak valid");return;}
  data.target=n;simpan();updateTampilan();
  toast("🎯 Target diubah menjadi "+rupiah(n));
}

function renderHistory(){
  const el=document.getElementById("history");
  if(!data.riwayat.length){el.innerHTML='<div class="empty">Belum ada transaksi.</div>';return;}
  el.innerHTML=data.riwayat.slice().reverse().map(t=>{
    const isPlus=["masuk","tabungan_keluar"].includes(t.jenis);
    const label={
      masuk:"Pemasukan",
      keluar:"Pengeluaran",
      tabungan_masuk:"Tabungan Masuk",
      tabungan_keluar:"Tabungan Keluar"
    }[t.jenis]||t.jenis;
    const waktu=new Date(t.timestamp).toLocaleString("id-ID");
    return `<div class="history-item">
      <div class="history-top">
        <span>${escapeHTML(label)}</span>
        <span class="${isPlus?"plus":"minus"}">${isPlus?"+":"-"}${rupiah(t.jumlah)}</span>
      </div>
      <div>${escapeHTML(t.keterangan)}</div>
      <div class="muted">${waktu} • Saldo ${rupiah(t.saldoSetelah)}</div>
      <button class="danger" onclick="hapusTransaksi('${t.id}')">Hapus</button>
    </div>`;
  }).join("");
}

function hapusTransaksi(id){
  const i=data.riwayat.findIndex(t=>String(t.id)===String(id));
  if(i<0)return;
  const t=data.riwayat[i];
  if(!confirm("Hapus transaksi ini? Saldo dan tabungan akan dikembalikan."))return;

  if(t.jenis==="masuk") data.saldo-=t.jumlah;
  if(t.jenis==="keluar") data.saldo+=t.jumlah;
  if(t.jenis==="tabungan_masuk"){data.saldo+=t.jumlah;data.tabungan-=t.jumlah;}
  if(t.jenis==="tabungan_keluar"){data.saldo-=t.jumlah;data.tabungan+=t.jumlah;}

  data.saldo=Math.max(0,data.saldo);
  data.tabungan=Math.max(0,data.tabungan);
  data.riwayat.splice(i,1);
  simpan();updateTampilan();toast("🗑️ Transaksi dihapus");
}

function hapusSemua(){
  if(!data.riwayat.length){toast("Tidak ada riwayat");return;}
  if(!confirm("Hapus SEMUA riwayat dan reset saldo/tabungan?"))return;
  data={saldo:0,tabungan:0,target:data.target,riwayat:[]};
  simpan();updateTampilan();toast("🗑️ Semua riwayat dihapus");
}

/* Grafik dimuat belakangan agar loading aplikasi tidak tersangkut. */
function loadChartJS(){
  if(window.Chart){chartReady=true;buatGrafik();return;}
  const s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/chart.js";
  s.onload=()=>{chartReady=true;document.getElementById("chartStatus").textContent="";buatGrafik();};
  s.onerror=()=>{document.getElementById("chartStatus").textContent="Grafik tidak tersedia tanpa koneksi internet.";};
  document.head.appendChild(s);
}

function buatGrafik(){
  if(!window.Chart)return;
  const canvas=document.getElementById("chart");
  if(!canvas)return;

  /* Hitung saldo awal agar grafik tetap cocok dengan saldo yang sudah ada. */
  let saldoAwal=data.saldo;
  data.riwayat.forEach(t=>{
    if(t.jenis==="masuk") saldoAwal-=t.jumlah;
    if(t.jenis==="keluar") saldoAwal+=t.jumlah;
    if(t.jenis==="tabungan_masuk") saldoAwal+=t.jumlah;
    if(t.jenis==="tabungan_keluar") saldoAwal-=t.jumlah;
  });

  let saldo=saldoAwal;
  const labels=["Awal"], values=[saldo];
  data.riwayat.forEach((t,i)=>{
    if(t.jenis==="masuk") saldo+=t.jumlah;
    if(t.jenis==="keluar") saldo-=t.jumlah;
    if(t.jenis==="tabungan_masuk") saldo-=t.jumlah;
    if(t.jenis==="tabungan_keluar") saldo+=t.jumlah;
    labels.push("#"+(i+1));values.push(saldo);
  });

  if(chart)chart.destroy();
  chart=new Chart(canvas,{
    type:"line",
    data:{labels,datasets:[{label:"Saldo",data:values,tension:.3,fill:false,borderWidth:2,pointRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true}},
      scales:{y:{ticks:{callback:v=>rupiah(v)}}}}
  });
}

function mulaiAplikasi(){
  muat();
  updateTampilan();

  /* Tutup loading SEBELUM Chart.js dimuat. */
  requestAnimationFrame(()=>{
    document.getElementById("loading").classList.add("hide");
    setTimeout(loadChartJS,80);
  });
}

document.addEventListener("DOMContentLoaded",mulaiAplikasi);
</script>
</body>
</html>
